<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | MCQ Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8fafc] text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300"></div>
<div id="sidebar-menu" class="fixed top-0 left-0 bottom-0 w-72 bg-white dark:bg-[#111827] z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col border-r border-slate-200/80 dark:border-slate-800/80">
    <div class="p-4 border-b border-slate-200/60 dark:border-slate-800/60 flex items-center gap-3 bg-slate-50 dark:bg-slate-900/50">
        <img id="sidebar-user-img" src="" class="w-10 h-10 rounded-full border-2 border-brand-500 hidden" alt="Profile">
        <div class="flex-1 overflow-hidden">
            <p id="sidebar-user-name" class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate">Loading...</p>
            <p id="sidebar-user-email" class="text-[10px] text-slate-500 truncate">...</p>
        </div>
        <button onclick="logoutUser()" class="w-8 h-8 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30 text-rose-500 flex items-center justify-center transition-colors">
            <i class="fa-solid fa-power-off text-sm"></i>
        </button>
    </div>
    <div id="sidebar-subjects-container" class="flex-1 overflow-y-auto p-3 space-y-1 custom-scrollbar"></div>
</div>

<nav class="sticky top-0 z-40 bg-white/80 dark:bg-[#111827]/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 transition-colors">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
            <button onclick="toggleSidebar()" class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors active:scale-95"><i class="fa-solid fa-bars text-sm"></i></button>
            <div class="flex items-center gap-1.5 cursor-pointer select-none" onclick="clearAndGoHome()">
                <span class="font-extrabold text-xs sm:text-sm tracking-tight text-slate-900 dark:text-slate-100 flex items-center gap-1">ExamPrep <span class="text-brand-600 font-medium text-[10px]">AI Engine</span></span>
            </div>
        </div>
        <div class="flex items-center gap-1 sm:gap-2">
            <div class="flex items-center bg-slate-50 dark:bg-slate-900 border border-slate-200/40 dark:border-slate-800/40 rounded-xl p-0.5 shadow-sm">
                <button onclick="changeFontSize(-1)" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg text-[10px] font-extrabold text-slate-500 hover:bg-white dark:hover:bg-slate-800 flex items-center justify-center transition-all">A-</button>
                <span class="w-[1px] h-3 bg-slate-200 dark:bg-slate-800"></span>
                <button onclick="changeFontSize(1)" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg text-[10px] font-extrabold text-slate-500 hover:bg-white dark:hover:bg-slate-800 flex items-center justify-center transition-all">A+</button>
            </div>
            <div class="flex items-center bg-slate-50 dark:bg-slate-900 border border-slate-200/40 dark:border-slate-800/40 rounded-xl p-0.5 shadow-sm">
                <button id="lang-btn-en" onclick="toggleLanguage('en')" class="px-2 h-7 sm:h-8 rounded-lg text-[10px] font-black transition-all">EN</button>
                <span class="w-[1px] h-3 bg-slate-200 dark:bg-slate-800"></span>
                <button id="lang-btn-hi" onclick="toggleLanguage('hi')" class="px-2 h-7 sm:h-8 rounded-lg text-[10px] font-black transition-all">HI</button>
            </div>
            <button id="silent-btn" onclick="toggleHaptics()" class="h-8 w-8 sm:w-auto sm:px-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition-all border border-transparent shadow-sm"></button>
            <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-xl bg-slate-50 dark:bg-slate-900 text-slate-500 border border-slate-200/40 dark:border-slate-800/40 flex items-center justify-center transition-all shadow-sm active:scale-95"><i id="theme-icon" class="fa-solid fa-moon text-xs"></i></button>
        </div>
    </div>
</nav>

<div id="global-loader" class="hidden fixed inset-0 bg-[#f8fafc]/60 dark:bg-[#0b0f19]/60 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="flex flex-col items-center gap-3 bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-800">
        <div class="w-9 h-9 border-4 border-brand-500/20 border-t-brand-600 rounded-full animate-spin"></div>
        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Syncing database node...</span>
    </div>
</div>
    <div class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 relative">
        <section id="view-quiz" class="grid grid-cols-1 lg:grid-cols-3 gap-8 animate-slide-in">
            <div class="lg:col-span-2 space-y-6">
                <div id="quiz-card-container" class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/60 p-6 rounded-3xl shadow-sm space-y-5 touch-pan-y">
                    <div class="flex items-center justify-between text-xs font-bold text-slate-400 dark:text-slate-500">
                        <span id="quiz-chapter-indicator" class="truncate pr-4">CHAPTER LOAD TRACK</span>
                        <span id="quiz-question-counter" class="bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-md text-brand-600 dark:text-brand-400 whitespace-nowrap">Q 0/0</span>
                    </div>

                    <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800/40 p-3 rounded-2xl border border-slate-100 dark:border-slate-800/60 -mt-2">
                        <div class="flex items-center gap-5 text-xs font-bold">
                            <span class="flex items-center gap-1.5 text-emerald-600"><i class="fa-solid fa-check"></i> <span id="score-live-correct">0</span></span>
                            <span class="flex items-center gap-1.5 text-rose-600"><i class="fa-solid fa-xmark"></i> <span id="score-live-wrong">0</span></span>
                            <span class="flex items-center gap-1.5 text-slate-500"><i class="fa-solid fa-forward-step"></i> <span id="score-live-skipped">0</span></span>
                        </div>
                        <div class="flex items-center gap-1.5 text-brand-600 font-extrabold text-xs px-2.5 py-1 rounded-lg">
                            <i class="fa-solid fa-crosshairs text-[10px]"></i> <span id="score-live-percent">0</span>%
                        </div>
                    </div>

                    <div class="w-full h-1 bg-slate-100 dark:bg-slate-800 rounded-full">
                        <div id="quiz-progress-bar" class="h-full bg-brand-600 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>

                    <div class="space-y-4 pt-1">
                        <h3 id="question-text" class="font-bold text-slate-900 dark:text-slate-100 scale-text-1">Loading evaluation criteria...</h3>
                        <div id="options-container" class="space-y-3 pt-2"></div>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800/60 gap-2 flex-wrap">
                        <button onclick="changeQuestion(-1)" class="px-4 py-2 text-xs font-bold text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl transition-all"><i class="fa-solid fa-chevron-left text-[10px]"></i> Prev</button>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleExplanation()" class="px-4 py-2 text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200/60 rounded-xl transition-all"><i class="fa-solid fa-lightbulb"></i> Analysis</button>
                            <button onclick="changeQuestion(1)" class="px-4 py-2 text-xs font-bold text-white bg-brand-600 rounded-xl transition-all">Next <i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                        </div>
                    </div>
                </div>

                <div id="explanation-panel" class="hidden bg-emerald-50/50 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-900/40 p-6 rounded-3xl animate-slide-in">
                    <h4 class="text-xs font-extrabold text-emerald-800 dark:text-emerald-400 mb-2"><i class="fa-solid fa-circle-info"></i> Detailed Solution Matrix</h4>
                    <p id="explanation-text" class="text-xs leading-relaxed font-medium text-slate-600 dark:text-slate-300"></p>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/60 p-5 rounded-3xl shadow-sm space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800/60 pb-3">
                        <h4 class="text-xs font-extrabold text-slate-400">Evaluation Index</h4>
                        <button onclick="submitQuizEvaluationReport()" class="px-3 py-1.5 bg-rose-50 text-rose-600 font-bold rounded-lg transition-all">End Review</button>
                    </div>
                    <div id="question-matrix-grid" class="grid grid-cols-5 gap-2 max-h-[260px] overflow-y-auto custom-scrollbar pr-1"></div>
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
