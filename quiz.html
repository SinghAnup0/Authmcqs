<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | MCQ Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8fafc] text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">
    
    <div id="global-loader" class="hidden fixed inset-0 bg-slate-950/20 backdrop-blur-xs flex items-center justify-center z-50">
        <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <header class="w-full bg-white dark:bg-slate-900 border-b border-slate-200/60 dark:border-slate-800/60 sticky top-0 z-40">
        <div class="max-w-5xl w-full mx-auto px-4 h-14 flex items-center justify-between gap-4">
            <button onclick="window.goBackToChaptersList()" class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-800 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-900 text-slate-500 shrink-0">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </button>

            <div class="flex items-center gap-1.5 sm:gap-2">
                <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200/40 dark:border-slate-800/40 rounded-xl p-0.5 shadow-xs">
                    <button onclick="window.changeFontSize(-1)" class="w-7 h-7 rounded-lg text-[10px] font-extrabold text-slate-500 hover:bg-white dark:hover:bg-slate-800 flex items-center justify-center transition-all">A-</button>
                    <span class="w-[1px] h-3 bg-slate-200 dark:bg-slate-800"></span>
                    <button onclick="window.changeFontSize(1)" class="w-7 h-7 rounded-lg text-[10px] font-extrabold text-slate-500 hover:bg-white dark:hover:bg-slate-800 flex items-center justify-center transition-all">A+</button>
                </div>

                <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200/40 dark:border-slate-800/40 rounded-xl p-0.5 shadow-xs">
                    <button id="lang-btn-en" onclick="window.toggleLanguage('en')" class="px-2 h-7 rounded-lg text-[10px] font-black transition-all">EN</button>
                    <span class="w-[1px] h-3 bg-slate-200 dark:bg-slate-800"></span>
                    <button id="lang-btn-hi" onclick="window.toggleLanguage('hi')" class="px-2 h-7 rounded-lg text-[10px] font-black transition-all">HI</button>
                </div>

                <button id="silent-btn" onclick="window.toggleHaptics()" class="h-8 w-8 rounded-xl text-xs font-bold flex items-center justify-center transition-all border border-transparent shadow-xs"></button>
                <button onclick="window.toggleDarkMode()" class="w-8 h-8 rounded-xl bg-slate-50 dark:bg-slate-950 text-slate-500 border border-slate-200/40 dark:border-slate-800/40 flex items-center justify-center shadow-xs">
                    <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 relative">
        <section id="view-quiz" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div id="quiz-card-container" class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/60 p-6 rounded-3xl shadow-sm space-y-5 touch-pan-y">
                    <div class="flex items-center justify-between text-xs font-bold text-slate-400 dark:text-slate-500">
                        <span id="quiz-chapter-indicator" class="truncate pr-4">CHAPTER SEGMENT</span>
                        <span id="quiz-question-counter" class="bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-md text-brand-600 dark:text-brand-400 whitespace-nowrap">Q 0/0</span>
                    </div>

                    <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800/40 p-3 rounded-2xl border border-slate-100 dark:border-slate-800/60 -mt-2">
                        <div class="flex items-center gap-5 text-xs font-bold">
                            <span class="flex items-center gap-1.5 text-emerald-600"><i class="fa-solid fa-check"></i> <span id="score-live-correct">0</span></span>
                            <span class="flex items-center gap-1.5 text-rose-600"><i class="fa-solid fa-xmark"></i> <span id="score-live-wrong">0</span></span>
                            <span class="flex items-center gap-1.5 text-slate-500"><i class="fa-solid fa-forward-step"></i> <span id="score-live-skipped">0</span></span>
                        </div>
                        <div class="flex items-center gap-1.5 text-brand-600 font-extrabold text-xs px-2.5 py-1 rounded-lg">
                            <i class="fa-solid fa-crosshairs text-[10px]"></i> <span id="score-live-percent">0</span>%
                        </div>
                    </div>

                    <div class="w-full h-1 bg-slate-100 dark:bg-slate-800 rounded-full">
                        <div id="quiz-progress-bar" class="h-full bg-brand-600 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>

                    <div class="space-y-4 pt-1">
                        <h3 id="question-text" class="font-bold text-slate-900 dark:text-slate-100 scale-text-1">Loading assessment questions...</h3>
                        <div id="options-container" class="space-y-3 pt-2"></div>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800/60 gap-2 flex-wrap">
                        <button onclick="window.changeQuestion(-1)" class="px-4 py-2 text-xs font-bold text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl transition-all"><i class="fa-solid fa-chevron-left text-[10px]"></i> Prev</button>
                        <div class="flex items-center gap-2">
                            <button onclick="window.toggleExplanation()" class="px-4 py-2 text-xs font-bold text-amber-700 bg-amber-50 dark:bg-amber-950/20 dark:text-amber-400 border border-amber-200/60 dark:border-amber-900/30 rounded-xl transition-all"><i class="fa-solid fa-lightbulb"></i> Analysis</button>
                            <button onclick="window.changeQuestion(1)" class="px-4 py-2 text-xs font-bold text-white bg-brand-600 rounded-xl transition-all">Next <i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                        </div>
                    </div>
                </div>

                <div id="explanation-panel" class="hidden bg-emerald-50/50 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-900/40 p-6 rounded-3xl">
                    <h4 class="text-xs font-extrabold text-emerald-800 dark:text-emerald-400 mb-2"><i class="fa-solid fa-circle-info"></i> Solution Commentary Matrix</h4>
                    <p id="explanation-text" class="text-xs leading-relaxed font-medium text-slate-600 dark:text-slate-300"></p>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/60 p-5 rounded-3xl shadow-sm space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800/60 pb-3">
                        <h4 class="text-xs font-extrabold text-slate-400">Evaluation Index</h4>
                        <button onclick="window.submitQuizEvaluationReport()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 dark:bg-rose-950/30 dark:text-rose-400 font-bold rounded-xl text-[10px] transition-all">End Test</button>
                    </div>
                    <div id="question-matrix-grid" class="grid grid-cols-5 gap-2 max-h-64 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
