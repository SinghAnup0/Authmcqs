<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapters | MCQ Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8fafc] text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">
    
    <div id="global-loader" class="hidden fixed inset-0 bg-slate-950/20 backdrop-blur-xs flex items-center justify-center z-50">
        <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <header class="w-full bg-white dark:bg-slate-900 border-b border-slate-200/60 dark:border-slate-800/60 sticky top-0 z-40">
        <div class="max-w-5xl w-full mx-auto px-4 h-14 flex items-center justify-between">
            <button onclick="window.clearAndGoHome()" class="font-black text-xs tracking-wider text-brand-600">PREP ENGINE</button>
            <div class="flex items-center gap-2">
                <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-200/40 dark:border-slate-800/40 rounded-xl p-0.5">
                    <button id="lang-btn-en" onclick="window.toggleLanguage('en')" class="px-2 h-7 rounded-lg text-[10px] font-black">EN</button>
                    <button id="lang-btn-hi" onclick="window.toggleLanguage('hi')" class="px-2 h-7 rounded-lg text-[10px] font-black">HI</button>
                </div>
                <button onclick="window.toggleDarkMode()" class="w-8 h-8 rounded-xl bg-slate-50 dark:bg-slate-950 text-slate-500 border border-slate-200/40 dark:border-slate-800/40 flex items-center justify-center">
                    <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 relative">
        <section id="view-chapters" class="space-y-6">
            <div class="flex items-center gap-3">
                <button onclick="window.goBackToSubjects()" class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-800 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-900 text-slate-500 transition-colors">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </button>
                <div>
                    <h2 id="current-subject-title" class="text-xl font-extrabold text-slate-950 dark:text-white">Chapters</h2>
                    <p class="text-xs font-medium text-slate-400 mt-0.5">Select a module segment to download evaluation questionnaires</p>
                </div>
            </div>
            <div id="chapters-container" class="grid grid-cols-1 gap-3"></div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
