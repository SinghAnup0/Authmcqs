<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results | MCQ Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8fafc] text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">
    
    <div id="global-loader" class="hidden fixed inset-0 bg-slate-950/20 backdrop-blur-xs flex items-center justify-center z-50">
        <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <header class="w-full bg-white dark:bg-slate-900 border-b border-slate-200/60 dark:border-slate-800/60 sticky top-0 z-40">
        <div class="max-w-5xl w-full mx-auto px-4 h-14 flex items-center justify-between">
            <button onclick="window.clearAndGoHome()" class="font-black text-xs tracking-wider text-brand-600">PREP ENGINE</button>
            <button onclick="window.clearAndGoHome()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-xs transition-all">Home Dashboard</button>
        </div>
    </header>

    <div class="flex-1 max-w-3xl w-full mx-auto px-4 py-8 relative space-y-8">
        <section class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/60 p-8 rounded-3xl shadow-sm text-center space-y-3">
            <div class="w-12 h-12 bg-brand-50 dark:bg-brand-950/40 text-brand-600 flex items-center justify-center rounded-2xl mx-auto text-lg"><i class="fa-solid fa-square-poll-vertical"></i></div>
            <h2 class="text-xl font-extrabold">Assessment Finalized</h2>
            <p class="text-xs text-slate-400">Your total accuracy scoring results have been processed successfully</p>
            
            <div class="flex items-center justify-center gap-8 pt-4">
                <div>
                    <span id="score-correct" class="text-2xl font-black text-emerald-600">0</span>
                    <span class="text-xs text-slate-400 block font-bold">Correct Answers</span>
                </div>
                <div class="w-[1px] h-8 bg-slate-100 dark:bg-slate-800"></div>
                <div>
                    <span id="score-total" class="text-2xl font-black text-slate-700 dark:text-slate-300">0</span>
                    <span class="text-xs text-slate-400 block font-bold">Total Items</span>
                </div>
            </div>
            <div class="pt-2">
                <span id="score-percentage-label" class="inline-block px-3 py-1 bg-brand-50 text-brand-600 dark:bg-brand-950/30 dark:text-brand-400 rounded-lg text-xs font-black">Accuracy: 0%</span>
            </div>
        </section>

        <section class="space-y-4">
            <h3 class="text-sm font-extrabold text-slate-400 tracking-wider uppercase">Itemized Evaluation Report</h3>
            <div id="detailed-review-list-container"></div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
