<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MCQ Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8fafc] text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen flex items-center justify-center transition-colors duration-300">
    
    <div id="global-loader" class="hidden fixed inset-0 bg-slate-950/20 backdrop-blur-xs flex items-center justify-center z-50">
        <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-xl max-w-sm w-full mx-4 text-center">
        <div class="w-16 h-16 bg-brand-50 dark:bg-brand-900/30 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-graduation-cap text-2xl"></i>
        </div>
        <h2 class="text-2xl font-extrabold mb-1">ExamPrep Engine</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-8">Sign in to access your modules</p>
        
        <button onclick="window.loginUser()" class="w-full flex items-center justify-center gap-3 bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 py-3 px-4 rounded-xl text-sm font-bold transition-all active:scale-95">
            <i class="fa-brands fa-google text-brand-500"></i> Continue with Google
        </button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
